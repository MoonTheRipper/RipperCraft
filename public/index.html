<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RipperCraft | Minecraft Server Dashboard</title>
    <!-- This panel sits behind a login on a LAN box. There is nothing here for a
         crawler to index, so it carries no social or search metadata. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="application-name" content="RipperCraft" />
    <meta name="apple-mobile-web-app-title" content="RipperCraft" />
    <meta name="theme-color" content="#0f1317" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Sized PNGs rather than one large image: browsers pick per context, and
         the 16/32 variants are cropped tighter so the mark stays readable in a
         tab strip. favicon.ico covers clients that ask for it by convention. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/styles.css?v=20260810-ui-overhaul" />
  </head>
  <body>
    <!-- Lives outside #app so it survives every re-render: a live region that is
         inserted together with its text is not reliably announced. Hidden with
         inline styles rather than a class so it cannot be un-hidden by a
         stylesheet change. -->
    <div
      id="notice-live"
      role="status"
      aria-live="polite"
      style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%);border:0;white-space:nowrap"
    ></div>
    <div id="app"></div>
    <noscript>
      <main class="auth-shell">
        <section class="auth-panel">
          <p class="brand-line brand-inline brand-line--stacked">
            <img class="brand-mark brand-mark--auth" src="/logo.png" alt="" width="512" height="404" />
            <span>RipperCraft</span>
          </p>
          <h1>JavaScript required</h1>
          <p class="muted copy">Enable JavaScript to use the Minecraft server dashboard.</p>
        </section>
      </main>
    </noscript>
    <script type="module" src="/app.js?v=20260810-ui-overhaul"></script>
  </body>
</html>
